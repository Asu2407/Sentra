"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
  base = "sentra"
  publish = "apps/web/dist"
  command = "npm --workspace=@sentra/web run build && node -e \"const fs=require('fs');const u=(process.env.SENTRA_API_URL||'https://sentra-gateway.onrender.com').replace(/\\/+$/,'');fs.writeFileSync('apps/web/dist/_redirects',['/api/*  '+u+'/api/:splat  200!','/mcp  '+u+'/mcp  200!','/healthz  '+u+'/healthz  200!','/*  /index.html  200'].join('\\n')+'\\n');\""
  environment = { NODE_VERSION = "20" }

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
