"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
  base = "sentra"
  publish = "apps/web/dist"
  command = """
    npm --workspace=@sentra/web run build && \
    API_URL="${SENTRA_API_URL:-https://sentra-gateway.onrender.com}" && \
    printf "/api/*  %s/api/:splat  200\n/mcp  %s/mcp  200\n/healthz  %s/healthz  200\n/*  /index.html  200\n" "$API_URL" "$API_URL" "$API_URL" > apps/web/dist/_redirects
  """
  environment = { NODE_VERSION = "20" }

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
